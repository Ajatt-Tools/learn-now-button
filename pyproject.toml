[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling>=1.24",
    "hatch-vcs>=0.4",
]

[project]
name = "card_management"
dynamic = ["version"]
description = "Put cards in the learning queue and answer cards from the Card Browser."
readme = "README.md"
requires-python = "~=3.10" # Anki add-on code must support Python 3.10.
license = { file = "LICENSE" }
keywords = ["ajatt"]
authors = [
    { name = "Ajatt-Tools and contributors" },
    { name = "Ren Tatsumoto", email = "tatsu@autistici.org" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Ajatt-Tools/learn-now-button"
Issues = "https://github.com/Ajatt-Tools/learn-now-button/issues"
Source = "https://github.com/Ajatt-Tools/learn-now-button"

# Tools

[tool.hatch.version]
source = "vcs"
path = "card_management/__about__.py"

[tool.hatch.build.hooks.vcs]
version-file = "card_management/__about__.py"

[tool.hatch.envs.dev]
dependencies = [
  "mypy>=1.0.0",
  "pytest",
  "aqt>=26.9",
  "beartype",
]
python = "3.10"

[[tool.hatch.envs.dev.matrix]]
# https://hatch.pypa.io/latest/tutorials/testing/overview/#testing-projects
python = ["3.10", ]

[tool.hatch.envs.dev.scripts]
# run as `hatch run dev:scriptname`
check = "mypy --install-types --non-interactive {args:card_management tests}"
package = "$(git rev-parse --show-toplevel)/scripts/package.sh"

[tool.coverage.run]
source_pkgs = ["card_management", "tests"]
branch = true
parallel = true
omit = [
    "card_management/__about__.py",
]

[tool.coverage.paths]
card_management = ["card_management", "*/card_management/card_management"]
tests = ["tests", "*/card_management/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 120
target-version = ['py310']
unstable = true

[tool.isort]
profile = "black"

[tool.basedpyright]
reportUnusedCallResult = false

[tool.pytest.ini_options]
# Only collect tests from the tests/ directory, not from source files.
testpaths = ["tests"]
# Unsupported annotations can leave functions unchecked. Fail tests on beartype warnings instead.
# https://docs.pytest.org/en/stable/how-to/capture-warnings.html#controlling-warnings
filterwarnings = [
    "error::beartype.roar.BeartypeWarning",
]

# https://hatch.pypa.io/latest/config/internal/testing/
# https://hatch.pypa.io/latest/tutorials/testing/overview/
[tool.hatch.envs.hatch-test]
dependencies = [
    # Hatch's --cover command needs the reporter installed in this environment.
    "coverage[toml]",
    "pytest",
    "pytest-xdist",
    "aqt>=26.9", # needed to run Anki addon tests
    "beartype",
]
system-packages = true
parallel = true
randomize = true

# Anki add-on code must keep working on Python 3.10.
[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", ]

# https://hatch.pypa.io/latest/how-to/static-analysis/behavior/
[tool.hatch.envs.hatch-check-fmt]
# pyupgrade>=3.22 needs Python 3.11+. Keep the tool runtime separate from Anki's compatibility target.
python = "3.14"
dependencies = [
    "black>=26.10",
    "isort>=9.0",
    "pyupgrade>=3.22",
]

# https://hatch.pypa.io/latest/config/internal/static-analysis/#scripts
[tool.hatch.envs.hatch-check-fmt.scripts]
format-check = [
    "bash \"$(git rev-parse --show-toplevel)/scripts/format.sh\" --check",
]
format-fix = [
    # run as: hatch check fmt --fix
    "bash \"$(git rev-parse --show-toplevel)/scripts/format.sh\" ",
]

[tool.hatch.envs.hatch-check-code]
dependencies = ["flake8"]

[tool.hatch.envs.hatch-check-code.scripts]
# Keep lint scope and exceptions in .flake8 rather than duplicating them in CI.
lint-check = "flake8 {args:card_management tests}"
lint-fix = "lint-check"

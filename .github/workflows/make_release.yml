name: "tagged-release"

on:
  push:
    tags:
      - "v*"

jobs:
  # Release tags must pass the same checks as branch pushes and pull requests.
  checks:
    uses: ./.github/workflows/ci.yml

  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"
    needs: checks
    permissions:
      contents: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: "recursive"

      - name: Install zipmerge
        run: |
          sudo apt-get install -y zipmerge

      - name: "Create zip"
        run: |
          ./scripts/package.sh --target github

      - name: "Create release"
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          make_latest: true
          generate_release_notes: true
          name: "Card Management ${{github.ref_name}}"
          files: |
            *.ankiaddon
